name: Docker Build Validation

on:
  push:
    branches: [main, develop]
    paths:
      - backend/**
      - frontend/**
      - docker-compose.yml
      - .github/workflows/docker.yml
  pull_request:
    branches: [main, develop]
    paths:
      - backend/**
      - frontend/**
      - docker-compose.yml
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t golden-key-backend-ci ./backend

      - name: Build frontend image
        run: docker build -t golden-key-frontend-ci ./frontend

      - name: Verify images
        run: |
          docker image inspect golden-key-backend-ci > /dev/null
          docker image inspect golden-key-frontend-ci > /dev/null
