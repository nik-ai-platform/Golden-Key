apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-key-config
  labels:
    app: golden-key-backend
data:
  ENVIRONMENT: production
  REQUEST_TIMEOUT_SECONDS: "20"
  RATE_LIMIT_PER_MINUTE: "120"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_TIMEOUT_SECONDS: "30"
  DB_POOL_RECYCLE_SECONDS: "1800"
  DB_POOL_PRE_PING: "true"
