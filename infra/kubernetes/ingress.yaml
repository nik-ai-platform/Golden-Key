apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: golden-key-ingress
spec:
  rules:
    - host: api.golden-key.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: golden-key-backend
                port:
                  number: 80
