apiVersion: v1
kind: Secret
metadata:
  name: golden-key-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://goldenkey:change-me@postgres:5432/goldenkey
  SECRET_KEY: change-me-in-production
  JWT_SECRET: change-me-in-production
  OPENAI_API_KEY: change-me-in-production
  SPORTSBOOK_API_KEYS: '{"odds_api":"change-me"}'
  REDIS_URL: redis://redis:6379/0
  SMTP_SETTINGS: '{"host":"smtp.example.com","port":587,"username":"ops","password":"change-me","from_email":"no-reply@golden-key.example.com","use_tls":true}'
  AUTH_DEMO_EMAIL: admin@golden-key.example.com
  AUTH_DEMO_PASSWORD: change-me-in-production
  POSTGRES_DB: goldenkey
  POSTGRES_USER: goldenkey
  POSTGRES_PASSWORD: change-me-in-production
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: change-me-in-production
