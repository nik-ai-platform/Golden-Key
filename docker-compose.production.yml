services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - golden_key_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - golden_key_network

  backend:
    image: golden-key-backend:production
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPORTSBOOK_API_KEYS: '${SPORTSBOOK_API_KEYS:-{}}'
      ODDS_API_KEY: ${ODDS_API_KEY:?ODDS_API_KEY is required}
      ODDS_API_BASE_URL: ${ODDS_API_BASE_URL:-https://api.the-odds-api.com/v4}
      REDIS_URL: ${REDIS_URL:-}
      SMTP_SETTINGS: '${SMTP_SETTINGS:-{}}'
      AUTH_DEMO_EMAIL: ${AUTH_DEMO_EMAIL:?AUTH_DEMO_EMAIL is required}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:?AUTH_DEMO_PASSWORD is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - golden_key_network

  final-score-worker:
    image: golden-key-backend:production
    restart: unless-stopped
    command: ["python", "-m", "app.workers.final_score_worker"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPORTSBOOK_API_KEYS: '${SPORTSBOOK_API_KEYS:-{}}'
      ODDS_API_KEY: ${ODDS_API_KEY:?ODDS_API_KEY is required}
      ODDS_API_BASE_URL: ${ODDS_API_BASE_URL:-https://api.the-odds-api.com/v4}
      REDIS_URL: ${REDIS_URL:-}
      SMTP_SETTINGS: '${SMTP_SETTINGS:-{}}'
      AUTH_DEMO_EMAIL: ${AUTH_DEMO_EMAIL:?AUTH_DEMO_EMAIL is required}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:?AUTH_DEMO_PASSWORD is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      FINAL_SCORE_SPORTS: ${FINAL_SCORE_SPORTS:-NFL,NBA,NCAAF,NCAAB,WNBA}
      FINAL_SCORE_POLL_SECONDS: ${FINAL_SCORE_POLL_SECONDS:-900}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - golden_key_network

  upcoming-game-worker:
    image: golden-key-backend:production
    restart: unless-stopped
    command: ["python", "-m", "app.workers.upcoming_game_worker"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPORTSBOOK_API_KEYS: '${SPORTSBOOK_API_KEYS:-{}}'
      ODDS_API_KEY: ${ODDS_API_KEY:?ODDS_API_KEY is required}
      ODDS_API_BASE_URL: ${ODDS_API_BASE_URL:-https://api.the-odds-api.com/v4}
      REDIS_URL: ${REDIS_URL:-}
      SMTP_SETTINGS: '${SMTP_SETTINGS:-{}}'
      AUTH_DEMO_EMAIL: ${AUTH_DEMO_EMAIL:?AUTH_DEMO_EMAIL is required}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:?AUTH_DEMO_PASSWORD is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      UPCOMING_GAME_SPORTS: ${UPCOMING_GAME_SPORTS:-NFL,NBA,NCAAF,NCAAB,WNBA}
      UPCOMING_GAME_POLL_SECONDS: ${UPCOMING_GAME_POLL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - golden_key_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-${NEXT_PUBLIC_API_URL}}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - golden_key_network

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - golden_key_network

volumes:
  golden_key_postgres:
  caddy_data:
  caddy_config:

networks:
  golden_key_network: