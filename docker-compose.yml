services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: goldenkey
      POSTGRES_USER: goldenkey
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldenkey -d goldenkey"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      API_URL: http://backend:8000
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      SPORTSBOOK_API_KEYS: ${SPORTSBOOK_API_KEYS:?SPORTSBOOK_API_KEYS is required}
      SPORTS_API_KEY: ${SPORTS_API_KEY:-}
      SPORTS_API_URL: ${SPORTS_API_URL:-}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SMTP_SETTINGS: ${SMTP_SETTINGS:?SMTP_SETTINGS is required}
      AUTH_DEMO_EMAIL: ${AUTH_DEMO_EMAIL:?AUTH_DEMO_EMAIL is required}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:?AUTH_DEMO_PASSWORD is required}
      PERF_IMPORT_MOCK: ${PERF_IMPORT_MOCK:-false}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: node:22
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
